name: Publish to npm (OIDC / Trusted Publishing)

# 与 publish.yml 二选一：这个版本不存 NPM_TOKEN。
#
# 前置条件（两个都要做，否则 publish 会 ENEEDAUTH）：
#   1. 首次发布必须用传统方式（Automation token）跑一次，把 oc-purge 这个包名占下来
#   2. 打开 https://www.npmjs.com/package/oc-purge/settings
#      → Trusted Publishing → 添加 GitHub 仓库：
#         Owner:  6zev
#         Repo:   oc-purge
#         Workflow: publish-oidc.yml
#         Environment: (留空)
#
# 之后每次发布都不需要任何 secret，npm 用 GitHub 签发的 OIDC token 验身份。

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "版本递增方式（release/tag 触发时忽略）"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write # 写回版本 / 建 tag
  id-token: write # ← OIDC 必需，没有这行 npm 认不出你

concurrency:
  group: npm-oidc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm 建议给 OIDC 发布单独建一个 environment，便于加审批门
    # environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 要求 npm ≥ 11.5
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            NEXT="${GITHUB_REF_NAME#v}"
            SOURCE="${GITHUB_EVENT_NAME} ${GITHUB_REF_NAME}"
          else
            NEXT=$(npm version "${{ inputs.bump || 'patch' }}" --no-git-tag-version --silent | sed 's/^v//')
            SOURCE="bump ${{ inputs.bump || 'patch' }}"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"       >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE"   >> "$GITHUB_OUTPUT"
          echo "Resolved: $CURRENT → $NEXT ($SOURCE)"

      - name: Sync package.json version
        shell: bash
        run: |
          set -euo pipefail
          NEXT="${{ steps.ver.outputs.next }}"
          if [ "$NEXT" != "${{ steps.ver.outputs.current }}" ]; then
            npm version "$NEXT" --no-git-tag-version --allow-same-version
          fi
          node -p "'publishing ' + require('./package.json').name + '@' + require('./package.json').version"

      - name: Guard against already-published version
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VER 已存在，换版本"
            exit 1
          fi
          echo "$NAME@$VER 未发布，继续"

      - name: Install dev deps
        run: npm install --no-save effect@^4.0.0

      - name: Syntax check
        shell: bash
        run: |
          for f in src/*.js legacy/*.js; do node --check "$f"; done

      - name: Test
        run: node --import ./test/register-stubs.mjs --test test/*.test.mjs

      # 注意：这里没有 NODE_AUTH_TOKEN。
      # setup-node 的 registry-url 已写进 .npmrc，npm 会自动去 GitHub 换 OIDC token。
      - name: Publish
        run: npm publish --access public --provenance

      - name: Commit version bump back
        if: github.event_name == 'workflow_dispatch' && steps.ver.outputs.next != steps.ver.outputs.current
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.ver.outputs.next }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
