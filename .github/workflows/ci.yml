name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install peer deps (for tests only)
        run: npm install --no-save effect@^4.0.0
      - name: Syntax check
        run: |
          for f in src/*.js legacy/*.js; do node --check "$f"; done
      - name: Test
        run: node --test test/*.test.mjs
